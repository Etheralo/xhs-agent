                    - paragraph [ref=e248]: 作者提出三个未来研究方向：(1) 扩展到更广泛的模态，如音频-语言或视频-语言模型；(2) 层-wise渐进式对齐，将单目标层扩展为多层联合考虑的框架；(3) 自适应和在线对齐，探索能够基于不断演化的用户输入或攻击模式动态更新安全对齐分布的在线变体。
                  - generic [ref=e249]:
                    - heading "编辑延伸判断" [level=4] [ref=e250]
                    - paragraph [ref=e251]: 我们认为，MMAligner的核心思想——通过几何对齐构建安全对齐的表示分布——可以进一步扩展到其他安全场景。首先，该方法可能适用于检测和缓解多模态模型中的其他类型对齐失败，如公平性或真实性对齐问题。其次，表示校准的框架可以与模型可解释性工具结合，为安全失败提供更细粒度的诊断。第三，硬下界和软上界的双重约束设计原则可以推广到其他需要精确控制模型行为的场景，如个性化对齐或领域自适应。此外，我们认为将MMAligner与测试时自适应（test-time adaptation）技术结合，可能在保持零训练开销的同时实现类似的安全提升，这对API-only模型尤为重要。最后，该方法的鲁棒性分析表明，将安全机制嵌入模型权重而非运行时干预，可能是对抗自适应攻击的更普适原则。
